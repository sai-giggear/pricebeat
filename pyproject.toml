[project]
name = "pricebeat"
# Read from app/__init__.py (see [tool.setuptools.dynamic]) so the running app
# can report its own version without a second copy here to drift out of sync.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "sqlmodel>=0.0.39",
    # httpx2 is the maintained continuation of httpx (pydantic stewardship);
    # httpx 0.x last released mid-2024 and starlette deprecates it.
    "httpx2>=2.7",
    "selectolax>=0.4",
    # 4.x removes BackgroundScheduler; stay on 3.x until we port.
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]
# Only needed to run or build the packaged desktop app; the API doesn't use them.
desktop = ["pywebview>=6.2", "pyinstaller>=6.21"]

# Without this, setuptools tries to auto-discover packages, sees frontend/ and
# tests/ alongside app/, and refuses to guess.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
